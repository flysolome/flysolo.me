[faq_kicker]
other = "Voordat je je aanmeldt"

[faq_title]
other = "De praktische vragen."

[faq_intro]
other = "FlySolo begint bewust smal: serieuze klantopdrachten voor senior tech-zzp'ers in Nederland en België."

[faq_1_question]
other = "Is FlySolo boekhoudsoftware?"

[faq_1_answer]
other = "Nee. FlySolo beheert de commerciële workflow vóór en rond je boekhouding: kans, voorstel, tarief, overeenkomst, handtekening, factuurvoorbereiding en betaalstatus. Moneybird blijft de overdracht naar je boekhouding."

[faq_2_question]
other = "Kan Otto iets naar mijn klant sturen zonder mij?"

[faq_2_answer]
other = "Nee. Otto kan analyseren en een concept maken, maar acties richting de klant vragen jouw controle en akkoord. Die regel geldt voor voorstellen, overeenkomsten, handtekeningverzoeken en factuurverzending."

[faq_3_question]
other = "Wat neem ik mee naar de proefmaand?"

[faq_3_answer]
other = "Neem een recent recruiterbericht, klantbriefing, tariefvraag of geanonimiseerde kans mee. De beste eerste sessie eindigt met iets dat je echt zou gebruiken of versturen."

[faq_4_question]
other = "Is FlySolo alleen in het Nederlands beschikbaar?"

[faq_4_answer]
other = "Nee. FlySolo is Dutch-first en ondersteunt Nederlandse en Engelse workflows. De eerste markt is senior freelance techprofessionals in Nederland; België staat op het uitbreidingspad."

[faq_5_question]
other = "Wat gebeurt er na de proefmaand?"

[faq_5_answer]
other = "Je kiest Starter, Professional of Business op basis van de workflow die je gebruikte. Je eerste betaalde periode begint na de beperkte maand, niet voordat je het product hebt ervaren."

