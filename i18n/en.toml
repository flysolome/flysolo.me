[faq_kicker]
other = "Before you apply"

[faq_title]
other = "The practical questions."

[faq_intro]
other = "FlySolo is intentionally narrow at the start: serious client opportunities for senior tech freelancers in the Netherlands and Belgium."

[faq_1_question]
other = "Is FlySolo accounting software?"

[faq_1_answer]
other = "No. FlySolo runs the commercial workflow before and around bookkeeping: opportunity, proposal, price, agreement, signature, invoice preparation, and payment status. Moneybird remains the bookkeeping handoff."

[faq_2_question]
other = "Can Otto send something to my client without me?"

[faq_2_answer]
other = "No. Otto can analyse and draft, but client-facing actions require your review and approval. That rule applies to proposals, agreements, signature requests, and invoice sends."

[faq_3_question]
other = "What should I bring to the trial?"

[faq_3_answer]
other = "Bring a recent recruiter message, client brief, pricing question, or anonymised opportunity. The best first session ends with something you would genuinely use or send."

[faq_4_question]
other = "Is FlySolo only available in Dutch?"

[faq_4_answer]
other = "No. FlySolo is Dutch-first and supports Dutch and English workflows. The first market focus is senior freelance tech professionals in the Netherlands, with Belgium in the expansion path."

[faq_5_question]
other = "What happens after the one-month trial?"

[faq_5_answer]
other = "You choose Starter, Professional, or Business based on the workflow you used. Your first paid period begins after the limited month rather than before you have experienced the product."

