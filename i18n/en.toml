[faq_kicker]
other = "Before you apply"

[faq_title]
other = "The practical questions."

[faq_intro]
other = "FlySolo is built for independent professionals who want a clearer path from client request to signed and paid work."

[faq_1_question]
other = "Is FlySolo accounting software?"

[faq_1_answer]
other = "No. FlySolo runs the commercial workflow before and around bookkeeping: opportunity, proposal, price, agreement, signature, invoice preparation, and payment status. Moneybird remains the bookkeeping handoff."

[faq_2_question]
other = "Can Otto send something to my client without me?"

[faq_2_answer]
other = "No. Otto can analyse and draft, but client-facing actions require your review and approval. That rule applies to proposals, agreements, signature requests, and invoice sends."

[faq_3_question]
other = "What should I bring to the trial?"

[faq_3_answer]
other = "Bring a recent client email, project brief, pricing question, or anonymised opportunity. The best first session ends with something you would genuinely use or send."

[faq_4_question]
other = "Which languages does FlySolo support?"

[faq_4_answer]
other = "FlySolo currently supports Dutch and English client work. The workflow is designed for independent professionals across disciplines, with more language and localization support planned over time."

[faq_5_question]
other = "What happens after the one-month trial?"

[faq_5_answer]
other = "You choose Starter, Professional, or Business based on the workflow you used. Your first paid period begins after the trial, once you have experienced the product."

